<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer un livre</title>
</head>
<body>
    <h1>Supprimer un livre</h1>
    <p>Voulez-vous vraiment supprimer « {{ livre.titre }} » de {{ livre.auteur }} ?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmer la suppression</button>
    </form>
    <a href="{% url 'liste_livres' %}">Annuler</a>
</body>
</html>
