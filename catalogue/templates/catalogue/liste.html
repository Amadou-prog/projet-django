<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogues de livres</title>
</head>
<body>
    <h1>Catalogues de livres</h1>
    <a href="{% url 'ajouter_livre' %}">Ajouter un livre</a>
    <ul>
        {% for livre in livres %}
        
            <li>{{ livre.titre }} - {{ livre.auteur }}</li>
            <a href="{% url 'modifier_livre' livre.id %}">Modifier</a>
            <a href="{% url 'supprimer_livre' livre.id %}">Supprimer</a>
            
        {% endfor %}
    </ul>
</body>
</html>
